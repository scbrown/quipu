name: Acceptance for the wasm explorer
description: >-
  Run both halves of the wasm acceptance against a built bundle — the browser
  smoke under Playwright Chromium, and the headless nodejs smoke.
  THE ONE DEFINITION both ci.yml and release.yml use.

# WHY THE DIRECTORY IS AN INPUT AND NOT A CONSTANT (aegis-dsbt2g).
#
# The two callers point this at genuinely different things, and that difference
# is DELIBERATE — it is the one thing about these jobs that should not be shared:
#
#   ci.yml      wasm/explorer/pkg   the bundle as wasm-bindgen emitted it
#   release.yml dist/<name>         the bundle as PACKAGED, which is what ships
#
# The release side is the stronger check: a file missed by the `cp` list in the
# packaging step produces a tarball that cannot instantiate, and only smoking the
# packaged layout can see it. So the input preserves a real difference while the
# ENVIRONMENT around the smoke — the playwright version, the browser install, the
# node that runs the script — stops being maintained twice.
#
# That distinction is the whole lesson of the bead this came from: what diverged
# was never the acceptance, it was the setup around it.

inputs:
  bundle-dir:
    description: Directory holding the built bundle to load in the browser.
    required: true
  node-bundle-dir:
    description: >-
      Directory holding the `wasm-bindgen --target nodejs` bundle. REQUIRED, and
      deliberately not defaulted: an optional input here would let a caller that
      forgot it pass with the headless half silently unrun, which is the exact
      failure shape this action exists to prevent.
    required: true

runs:
  using: composite
  steps:
    # A bundle that ships but cannot instantiate is the failure this catches, and
    # nothing upstream would: `cargo build` proves it compiles and wasm-bindgen
    # proves the glue generated. Neither loads the module.
    - name: Browser acceptance (smoke-wasm-explorer.mjs)
      shell: bash
      env:
        BUNDLE_DIR: ${{ inputs.bundle-dir }}
      run: |
        set -euo pipefail
        npm init -y >/dev/null
        npm install --no-save playwright@1.56
        npx playwright install --with-deps chromium
        node scripts/smoke-wasm-explorer.mjs "$BUNDLE_DIR"

    # THE HEADLESS HALF (aegis-onew9p §4.4). Same compiled .wasm, a different
    # generated glue layer: CommonJS instead of ESM, filesystem loading instead
    # of fetch, and no init() to await. None of that is exercised above, so a
    # break in it is invisible to the browser smoke and fatal to every consumer
    # that has no display — which is the case the nodejs target exists for.
    #
    # It needs no browser, so it runs SECOND: when both fail, the cheaper one
    # having already passed tells you the fault is in the browser environment
    # rather than in the bundle.
    - name: Headless acceptance (smoke-wasm-node.mjs)
      shell: bash
      env:
        NODE_BUNDLE_DIR: ${{ inputs.node-bundle-dir }}
      run: node scripts/smoke-wasm-node.mjs "$NODE_BUNDLE_DIR"
