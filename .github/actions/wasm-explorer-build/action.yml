name: Build the wasm explorer bundle
description: >-
  Toolchain, cache, wasm-bindgen-cli at the lockfile-pinned version, the native
  binary, and the browser bundle. THE ONE DEFINITION both ci.yml and release.yml
  use, so they cannot diverge.

# WHY THIS EXISTS (aegis-dsbt2g, from aegis-tpqccc).
#
# `Wasm (browser bundle)` in ci.yml and `Wasm (release asset)` in release.yml ran
# the same acceptance from two separately maintained job definitions, and they
# had ALREADY diverged at the moment they were written: the CI copy built the
# native binary and the release copy did not. The smoke mints a share with the
# native binary and imports the browser's export back with it, so the release job
# died with
#
#   Error: spawnSync .../target/release/quipu ENOENT
#
# AFTER v0.3.33 was tagged — while the PR job was green on the identical commit.
# The point of the PR-side job was that the release job's first execution should
# not be a live release. It was anyway, because what the PR job exercised was
# ci.yml's environment, not release.yml's.
#
# RUNNING "THE SAME" ACCEPTANCE IN TWO PLACES PROTECTS NOTHING WHEN THE SETUP
# AROUND IT DIFFERS. The script was byte-identical; the environment was not.
#
# Two further divergences were still live when this was extracted, neither
# caught by the comment-based fix that preceded it:
#   * ci.yml cached the root `target`; release.yml did not — so release.yml
#     rebuilt the native binary from scratch every time.
#   * ci.yml pinned node 22 via setup-node; release.yml used whatever the runner
#     shipped, and the smoke it runs is a node script.
# Neither was going to be found by reading two files side by side, which is the
# argument for one definition rather than a rule about keeping two in step.
#
# A COMPOSITE ACTION, NOT A REUSABLE WORKFLOW (`workflow_call`). release.yml's
# job continues after this — package, upload, dispatch docs — and needs the built
# artifacts in the SAME workspace. A reusable workflow runs as its own job on its
# own runner, so the bundle would have to be shipped between them as an artifact
# for no benefit. ci.yml calls this and stops; release.yml calls it and carries on.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    # The smoke is a node script. Pin it here rather than in each caller, which
    # is exactly the kind of per-caller setting that drifted before.
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: actions/cache@v4
      with:
        # `target` is the ROOT one, for the native binary built below. Its
        # absence from release.yml's copy was a live divergence.
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/wasm-bindgen
          target
          wasm/explorer/target
        key: ${{ runner.os }}-cargo-wasm-explorer-${{ hashFiles('wasm/explorer/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-wasm-explorer-
          ${{ runner.os }}-cargo-wasm-

    # The CLI matching wasm/explorer/Cargo.lock — the generated JS glue must come
    # from the exact wasm-bindgen the crate compiled against, or the bundle fails
    # at init with a version-mismatch message. Read from the lockfile rather than
    # pinned as a second copy, so the two cannot drift.
    - name: Install wasm-bindgen-cli
      shell: bash
      run: |
        set -euo pipefail
        V=$(grep -A1 '^name = "wasm-bindgen"$' wasm/explorer/Cargo.lock | grep '^version' | cut -d'"' -f2)
        if ! command -v wasm-bindgen >/dev/null || ! wasm-bindgen --version | grep -qF "$V"; then
          cargo install wasm-bindgen-cli --version "$V" --locked --force
        fi

    # THE STEP WHOSE ABSENCE SHIPPED v0.3.33 WITHOUT A WASM ASSET. The smoke
    # mints a pack with the NATIVE binary in the same run, so both halves of the
    # round trip are the same commit by construction. It is here, once, because
    # a step that must exist in two places is a step that will eventually exist
    # in one.
    - name: Build the native binary
      shell: bash
      run: cargo build --release --locked --bin quipu

    - name: Build the explorer bundle
      shell: bash
      working-directory: wasm/explorer
      run: |
        set -euo pipefail
        # NO `--locked`, matching the wasm/harness job, and for the reason that
        # job already had: this crate is outside the workspace, so it carries its
        # OWN Cargo.lock, and that lockfile records the PARENT crate's version
        # through the path dependency. release-plz bumps the root Cargo.toml and
        # updates the root lockfile; it knows nothing about this second one. So on
        # every release PR the explorer lockfile is stale by exactly one version
        # bump and `--locked` refuses:
        #
        #   error: cannot update the lock file wasm/explorer/Cargo.lock
        #   because --locked was passed to prevent this
        #
        # Measured on PR #118 (v0.3.33) and reproduced locally, exit 101.
        #
        # The lockfile stays COMMITTED and still does its real job: the step above
        # greps it for the wasm-bindgen version, which must match the crate exactly
        # or the bundle fails at init. Third-party pins move only when this
        # lockfile is regenerated and reviewed.
        cargo build --release
        # Resolve the target dir rather than assuming `target/`. It is unset in
        # Actions so `target/` would be correct HERE, but that same assumption is
        # what wedged aegis CD (2026-09-05): a build that 'succeeded' produced a
        # binary stamped with the PREVIOUS commit. Asking cargo costs one line and
        # cannot be wrong.
        TARGET=$(cargo metadata --format-version 1 --no-deps \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
        WASM="$TARGET/wasm32-unknown-unknown/release/quipu_wasm_explorer.wasm"
        wasm-bindgen --target web --out-dir pkg "$WASM"
        # The SAME .wasm, a second glue layer (aegis-onew9p §4.4). wasm-bindgen
        # generates different JS for the nodejs target; it does not recompile,
        # so the headless build costs one invocation rather than a second Rust
        # build — and it is by construction the same engine as the browser one,
        # which is the property that makes "the page and the CLI agree" extend
        # to headless agents.
        wasm-bindgen --target nodejs --out-dir pkg-node "$WASM"

        # ASSERT THE PROPERTY, NOT THE MECHANISM.
        #
        # "Same engine by construction" is currently true because both calls
        # above take the same $WASM. That is one shell variable, and nothing
        # would catch a future edit that adds a second `cargo build` to a
        # different path and points one of the two at it — the file would still
        # be named the same and both bundles would still work.
        #
        # Measured 2026-09-05 at wasm-bindgen 0.2.128: the two emitted
        # `_bg.wasm` are BYTE-IDENTICAL (sha256
        # 4ad2740fb6d6400b91c22dec26f743c2058d605069509b7f1ed0ee5fd491d33a,
        # 3241355 bytes, both targets). So the claim is checkable rather than
        # merely stated, and this compares the artifacts rather than the source
        # they were told to read.
        #
        # It asserts the PROPERTY: if someone points the two targets at
        # different builds that happen to be bit-identical, nothing is wrong and
        # this passes; if they differ in features or profile, it fails.
        #
        # ⚠ If a future wasm-bindgen post-processes the two targets differently,
        # this will fail on a toolchain bump. That is the correct prompt to
        # re-verify the "same engine" claim rather than a reason to delete the
        # check — but it IS a legitimate failure, so read it before assuming a
        # regression.
        if ! cmp -s pkg/quipu_wasm_explorer_bg.wasm pkg-node/quipu_wasm_explorer_bg.wasm; then
          echo "::error::the browser and nodejs bundles carry DIFFERENT wasm." \
               "They are supposed to be one compile behind two glue layers, so" \
               "a consumer choosing between them chooses a loader, not a version." \
               "Either a second build crept in, or wasm-bindgen now post-processes" \
               "the targets differently — check which before assuming a regression."
          sha256sum pkg/quipu_wasm_explorer_bg.wasm pkg-node/quipu_wasm_explorer_bg.wasm
          exit 1
        fi
        echo "browser and nodejs bundles carry byte-identical wasm"
