name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# CD consumes only the newest main commit. Cancel superseded runs on every ref
# so an old 22-job matrix cannot starve the six checks gating the current head.
# Pushes run only those six; release-only surfaces run on PRs and nightly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            flags: "--no-default-features"
          - name: shacl
            flags: "--features shacl"
          # The `full` bundle (Cargo.toml) is what releases ship, and it is a
          # superset of shacl+onnx. Before it existed NOTHING linted quipu-server
          # (required-features shacl+onnx) nor the owl / reactive-reasoner code —
          # adding it turned up 11 findings on first run. It now runs in the
          # serial extended-features job on PRs/nightly.
          # `remote` WITHOUT `server`: the federation HTTP client on its own.
          # `full` implies both, so without the extended job the standalone-client
          # cfg combination — the one a wasm-adjacent build would select — is
          # never compiled. See docs/design/wasm-support.md §4.3.
          # quipu-lv7 made `vector.backend = "lancedb"` selectable from config,
          # so this backend and its install path are shipped code — but they are
          # NOT in `full` (protoc + the datafusion tree is a real cost), so
          # the push matrix does not compile it. The extended job preserves it.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-${{ matrix.name }}-
            ${{ runner.os }}-cargo-
      # --all-targets covers tests, examples and benches. Without it an
      # example could reference feature-gated APIs and only fail in the
      # `test` job, which is exactly how examples/shacl_cost.rs broke the
      # --no-default-features build.
      - run: cargo clippy ${{ matrix.flags }} --all-targets -- -D warnings -A missing-docs

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            flags: "--no-default-features"
          - name: shacl
            flags: "--features shacl"
          # The gated RemoteProvider tests, which `--no-default-features`
          # compiles out entirely, run in extended-features on PRs/nightly.
          # Runs the LanceDB backend's own tests AND the config-selection test
          # that proves a write through the store lands there and not in the
          # SQLite table (quipu-lv7). Extended-features compiles and runs them.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.name }}-
            ${{ runner.os }}-cargo-
      - run: cargo test ${{ matrix.flags }}

  # Unique but non-CD-gating cfg surfaces. Run them serially on PRs/nightly so
  # they remain release evidence without competing with a pushed head's six
  # required checks for account runners.
  extended-features:
    name: Extended feature surfaces
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-extended-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-extended-
            ${{ runner.os }}-cargo-
      - run: cargo clippy --features full --all-targets -- -D warnings -A missing-docs
      - run: cargo clippy --no-default-features --features remote --all-targets -- -D warnings -A missing-docs
      - run: cargo clippy --features shacl,lancedb --all-targets -- -D warnings -A missing-docs
      - run: cargo test --no-default-features --features remote
      - run: cargo test --features shacl,lancedb

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo build
      # This is executable documentation, not a second hand-written example:
      # the checked transcript embedded by the sharing chapter must equal a
      # fresh two-store run of the binary built immediately above.
      - name: Sharing and federation story demo
        run: examples/sharing-demo/run.sh --check
      - name: Cross-graph alignment demo
        run: examples/align-demo/run.sh --check

  # The release workflow ships binaries built with the `full` bundle. Without
  # this job an onnx-gated break would first appear during a release, which is
  # the worst possible place to find it.
  build-full:
    name: Build (full bundle)
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-full-
      - run: cargo build --locked --features full --bin quipu --bin quipu-server

  # The wasm32 target and browser harness (docs/design/wasm-support.md;
  # quipu-qd2/ajz/2l5). Per AGENTS.md a feature does not ship dark: this job
  # IS the wasm feature's presence in the matrix (quipu-ame). Three legs:
  # the library compiles for wasm32-unknown-unknown; the browser acceptance
  # passes (store on memory VFS and OPFS, data surviving a page reload and a
  # browser relaunch); and the .db interchange round-trips (browser export →
  # quipu CLI + sqlite3, browser-produced pack → native attach, native .db →
  # browser import). Steps mirror `just wasm check|test|roundtrip` without a
  # just dependency, matching the raw-cargo style of the other jobs.
  wasm:
    name: Wasm (browser harness)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
            wasm/harness/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
            ${{ runner.os }}-cargo-
      # Leg 1: the library builds for the target, warnings and all gates as
      # the native builds run them.
      - name: Check wasm32 target
        run: RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo check --target wasm32-unknown-unknown --no-default-features --lib
      # The CLI matching wasm/harness/Cargo.lock — the generated JS glue must
      # come from the exact wasm-bindgen the harness compiled against.
      - name: Install wasm-bindgen-cli
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' wasm/harness/Cargo.lock | grep '^version' | cut -d'"' -f2)
          if ! command -v wasm-bindgen >/dev/null || ! wasm-bindgen --version | grep -qF "$V"; then
            cargo install wasm-bindgen-cli --version "$V" --locked --force
          fi
      - name: Install Playwright Chromium
        working-directory: wasm/harness
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.56
          npx playwright install --with-deps chromium
      - name: Build harness
        working-directory: wasm/harness
        run: |
          cargo build --release
          wasm-bindgen --target web --out-dir www/pkg \
            target/wasm32-unknown-unknown/release/quipu_wasm_harness.wasm
      # Leg 2: the quipu-qd2 acceptance — OPFS reload persistence included.
      - name: Browser acceptance (run.mjs)
        working-directory: wasm/harness
        run: node run.mjs
      # Leg 3: the quipu-2l5 acceptance. Builds the native examples and the
      # shacl-featured quipu CLI through cargo; sqlite3 ships on the runner,
      # so the integrity-check leg runs rather than skipping.
      - name: Interchange round-trip (roundtrip.mjs)
        working-directory: wasm/harness
        run: node roundtrip.mjs

  # The SHIPPED browser bundle (aegis-tpqccc), exercised here rather than only
  # at release time.
  #
  # The release workflow's `wasm` job builds this bundle, runs this same smoke
  # script and attaches the artifact. Left to itself, that job's FIRST EVER
  # execution would be during a real release — and a failure there means a
  # release with a red job and no wasm asset, discovered by the book page going
  # dark. Running the identical build + smoke on PRs means the release job is
  # never the thing being tested for the first time.
  #
  # Deliberately NOT the same job as `wasm` above: that one is the qd2/2l5
  # acceptance harness for the library on wasm32, this one is the product
  # bundle the book page loads. They share a target triple and nothing else,
  # and merging them would hide which of the two went red.
  wasm-explorer:
    name: Wasm (browser bundle)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ONE definition, shared with release.yml's `Wasm (release asset)`. These
      # two ran the same acceptance from two hand-maintained job lists and had
      # diverged the moment they were written (aegis-dsbt2g); the divergence was
      # invisible until a real release. Change the steps in the action, not here.
      - uses: ./.github/actions/wasm-explorer-build

      # The bundle as wasm-bindgen emitted it. release.yml smokes the PACKAGED
      # layout instead — the one deliberate difference between the two callers.
      - uses: ./.github/actions/wasm-explorer-smoke
        with:
          bundle-dir: wasm/explorer/pkg
          node-bundle-dir: wasm/explorer/pkg-node

  check:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files
        env:
          SKIP: mdbook-build

      # The refusals that stand between a rehearsal and crates.io (aegis-pb4rzi).
      # This job gates `release-correctness`, which is the right place for it:
      # a guard protecting the release lane should be proven by something that
      # blocks a release when it breaks.
      #
      # It is a selftest rather than a lint because the property is behavioural.
      # Nothing else can catch a guard that has been quietly loosened — the
      # workflow would stay green, and the next thing to notice would be a
      # rehearsal tag on crates.io, which cannot be undone.
      - name: Prove the crates publish guard still refuses
        run: scripts/ci/crates-publish-guard.sh --selftest

  source-size:
    name: Source size ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The AUTHORITATIVE file-size scan. The pre-commit hook runs --staged,
      # which is right locally but checks nothing under `--all-files` (nothing
      # is staged in CI) — that is exactly the hole quipu-5le describes, where
      # the guard was green for its whole life without ever reading a file.
      # The scanner the gate counts with, before the gate that trusts it. Its
      # lifetime case fails in the PASSING direction if it is ever broken —
      # `&'a str` read as an unterminated char literal swallows the rest of the
      # file and reports a low count — so an untested scanner is a gate that
      # quietly stops gating (aegis-gf3j7).
      - run: scripts/test-rust-sloc.py
      - run: scripts/test-check-file-size.sh
      - run: scripts/check-file-size.sh

  load-test:
    name: Mixed load performance ratchet
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-load-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harness self-test
        run: scripts/quipu-load-test.py --self-test
      - name: Build server
        run: cargo build --locked --features full --bin quipu-server
      - name: Run mixed load ratchet
        run: |
          DB="$(mktemp --suffix=.db)"
          target/debug/quipu-server --db "$DB" --bind 127.0.0.1:3030 >server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3030/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3030/health >/dev/null
          scripts/quipu-load-test.py \
            --baseline benchmark/load-test-baseline.json \
            --output load-test-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quipu-load-test-report
          path: |
            load-test-report.json
            server.log

  shapes:
    name: Shape invariants
    runs-on: ubuntu-latest
    # A SEPARATE JOB, so its verdict is its own (aegis-qq7uw). The defect being
    # fixed is that `shapes/verify_shape_invariants.py` was wired into NOTHING —
    # no workflow referenced it, nothing else invoked it, and it ran only when a
    # human remembered to type it. It was RED for 17 DAYS and nobody knew:
    # a5eb73b added sh:minCount 1 on aegis:regex and aegis:enforcementTier to
    # TextRuleShape, which I1 rejects, so the script exited 1 from 2026-08-07
    # until 2026-08-24. The finding turned out to be a false positive in
    # substance — but nobody adjudicated it for 17 days BECAUSE NOBODY SAW IT.
    # A gate that is red and unrun makes no claim at all.
    #
    # NOT PATH-FILTERED, deliberately. `paths: shapes/**` is the obvious
    # refinement and it reintroduces the exact failure mode: a way for the gate
    # to legitimately not run, which is indistinguishable from the gate being
    # broken. The static half takes about a second and needs no network, so
    # there is nothing to buy by skipping it.
    #
    # STATIC HALF ONLY. I1/I2/I3/I9 and --selftest need no server. I4/I7/I8 want
    # --data/--live against a running store; they stay out until there is a
    # fixture worth trusting, and the script SAYS so per-invariant ("SKIPPED (no
    # --live)") rather than quietly counting them as passed.
    #
    # I9 REPORTS, IT DOES NOT GATE — and that is the script's own design, not a
    # concession made here. I1's "only rdfs:label may be required" is an
    # aegis-ontology.shapes.ttl policy; governance.ttl's Verdict genuinely
    # requires a signature and an evidenceHash. I9 currently prints 3 reports
    # over 3 files (48 required-predicate + 14 missing-label findings). Gating on
    # those would fail every PR on day one and the job would be switched off
    # within a day, taking the real findings with it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # REFUSE A VACUOUS PASS. If the script is renamed, moved or deleted, a
      # `python3 <missing>` would fail loudly — but a future edit that wrapped
      # this in a conditional, or a glob that stopped matching, would not. Assert
      # the thing exists before claiming its verdict, because "the job was green"
      # must never be reachable without the check having run.
      - name: The gate must exist before it can pass
        run: |
          test -f shapes/verify_shape_invariants.py \
            || { echo "::error::shapes/verify_shape_invariants.py is missing — refusing a green that checked nothing"; exit 1; }
      # The script's own both-direction proof: I5/I6 fail on unshaped documented
      # kinds and pass on agreement, I7 isolates live-but-undeclared kinds, I8
      # derives the abstract set and is retired by shaping, and I9 stays
      # non-fatal and visible. Run FIRST: if the checker's own logic is broken,
      # its verdict on the real shapes is worth nothing.
      - name: Self-test the invariant checker
        run: python3 shapes/verify_shape_invariants.py --selftest
      - name: Verify shape invariants (static)
        run: python3 shapes/verify_shape_invariants.py

  lint-markdown:
    name: Markdown lint
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pin to the same version pre-commit uses (.pre-commit-config.yaml) so CI
      # and local linting agree and CI cannot drift onto a newer rule set.
      - run: npx markdownlint-cli2@0.17.2

  # One check for the release workflow to consume across the workflow boundary.
  # Keep housekeeping outside this list: fmt and markdown lint can be red
  # without saying that the shipped binary is unsafe. Every item below compiles,
  # executes, or validates production behavior/invariants. Source size belongs
  # here because a violation blocks the release PR; leaving it out made push CI
  # report success for a main revision that could not be released.
  release-correctness:
    name: Release correctness
    if: always()
    needs: [clippy, test, build, check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every correctness job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS_JSON")"
          if [ -n "$failed" ]; then
            echo "::error::release correctness failed:" >&2
            printf '%s\n' "$failed" >&2
            exit 1
          fi
          echo "All release correctness jobs passed."

  extended-correctness:
    name: Extended correctness
    if: always() && github.event_name != 'push'
    needs: [extended-features, build-full, wasm, source-size, load-test, shapes, lint-markdown]
    runs-on: ubuntu-latest
    steps:
      - name: Require every extended surface to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS_JSON")"
          if [ -n "$failed" ]; then
            echo "::error::extended correctness failed:" >&2
            printf '%s\n' "$failed" >&2
            exit 1
          fi
          echo "All extended surfaces passed."
