name: Changelog check

# ⚠ THIS WORKFLOW IS DARK WHILE A RELEASE PR'S HEAD COMMIT IS BOT-AUTHORED. Do not
# read its status — or its absence — as evidence a release PR is clean.
#
# Measured 2026-08-02: the first 33 runs of this workflow, every one on a
# `release-plz-*` branch, were `action_required` with 0s duration — never executed,
# while three bad changelogs shipped past it.
#
# The gate keys on the HEAD COMMIT'S AUTHOR, not the PR's author. Measured as a
# controlled A/B on one branch, minutes apart:
#
#   da2c856a  author github-actions[bot]  ->  action_required   (dark)
#   853994ef  author scbrown              ->  success           (ran, and passed)
#
# So a human commit onto a release PR's branch un-darkens it, and this check then
# runs before merge. It is a real gate again, just not an unattended one.
#
# ⚠ HAND-CORRECTION IS NO LONGER THE PROCEDURE. As of the `Correct the release PR's
# changelog section` step in release.yml, the section is regenerated with git-cliff
# automatically, in the same run that release-plz writes the PR. If that step is
# working you should never need to touch a release changelog by hand, and this check
# should be green without intervention. The history below is kept because it explains
# WHY the correction had to be automatic rather than a documented manual step.
#
# ⚠ A HAND-CORRECTION IS NOT DURABLE — CORRECT AND MERGE IN ONE SITTING.
# release-plz ABANDONS a branch it did not write. Measured: I corrected #61's section
# by hand at 15:23Z; on the next push to main it closed #61 (15:40:56Z) and opened #62
# on a fresh branch three seconds later, with the defective section back. The fix was
# discarded silently. #60 survived only because it was merged before the next push.
#
# Do not leave a corrected release PR sitting. Correct it, confirm this check is
# green, merge. Otherwise the next push to main throws the correction away.
#
# An earlier version of this note said the darkness was "unfixable from the repo
# side, it needs the Actions approval setting changed". That was WRONG, and wrong in
# the direction that stops you looking. Corrected once the A/B above was measured.
#
# The unattended copy is the `verify-changelog` job in release.yml, which runs on
# `push` to main and needs no approval. Keep both: that one always runs, this one
# covers the pre-merge moment on the PR itself.
#
# Gate against release-plz's changelog commit mis-selection.
# release-plz has documented only the newest few commits of a multi-commit release
# (v0.3.6: 4 of 17) and, separately, dumped full history for an empty release
# (v0.3.7). git-cliff with this repo's cliff.toml is correct; this job regenerates
# the correct delta and fails a release PR whose CHANGELOG section is missing
# commits — so a bad changelog cannot be merged unnoticed (v0.3.5's was).
on:
  pull_request:
    paths:
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  verify:
    name: Verify changelog completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: the verifier ranges over v<prev>..HEAD

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Verify newest CHANGELOG section is complete
        run: ./scripts/verify-changelog.sh
