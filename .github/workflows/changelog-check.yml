name: Changelog check

# ⚠ THIS WORKFLOW DOES NOT RUN ON RELEASE PRs, AND NEVER HAS. Do not read its
# status — or its absence — as evidence a release PR is clean.
#
# Measured 2026-08-02: all 33 runs of this workflow, every one on a `release-plz-*`
# branch, are `action_required` with 0s duration. Release PRs are authored by
# `app/github-actions`, and workflow runs on bot-authored PRs wait for a human to
# approve them. Nobody ever did, so this gate has never once executed on the PRs it
# exists to gate, while three bad changelogs shipped past it.
#
# The copy that actually protects releases is the `verify-changelog` job in
# release.yml, which runs on `push` to main — an untriggered gate is not a gate.
# This file is kept because it still covers HUMAN PRs touching CHANGELOG.md, where
# the approval gate does not apply.
#
# Gate against release-plz's changelog commit mis-selection.
# release-plz has documented only the newest few commits of a multi-commit release
# (v0.3.6: 4 of 17) and, separately, dumped full history for an empty release
# (v0.3.7). git-cliff with this repo's cliff.toml is correct; this job regenerates
# the correct delta and fails a release PR whose CHANGELOG section is missing
# commits — so a bad changelog cannot be merged unnoticed (v0.3.5's was).
on:
  pull_request:
    paths:
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  verify:
    name: Verify changelog completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: the verifier ranges over v<prev>..HEAD

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Verify newest CHANGELOG section is complete
        run: ./scripts/verify-changelog.sh
