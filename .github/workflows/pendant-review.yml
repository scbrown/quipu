name: pendant review

# The PR check for pendant changes (aegis-fxpbys.1, M2). Without it a pack change
# reaches review as a raw line diff of full-IRI N-Triples. With it, the job
# summary (the check-run page) carries, per changed pack: the entity-grouped
# fact diff, SHACL violations INTRODUCED by the change, any merge decisions
# sidecar, and the alias caveat. See docs/book/src/reference/cli-sharing.md.
#
# RED ONLY on an introduced SHACL violation, or when a report cannot be
# computed (an unevaluable gate must not read as a pass). Everything else is
# informational.
#
# Any base branch, not only main: stacked PRs change packs too.
on:
  pull_request:
    paths:
      - "**/*.nt"
      - "**/*.nq"
      - "**/manifest.json"
      - "**/manifest.ttl"
      - "**/shapes.ttl"
      - "**/decisions.json"
      - "scripts/ci/pendant-review.py"
      - ".github/workflows/pendant-review.yml"
      - "src/share_pack_review*.rs"
      - "src/cli_share_diff.rs"
      - "src/share_diff*.rs"
      - "src/git_merge*.rs"
      - "src/shacl*.rs"
      - "src/shacl/**"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/share_review*.rs"

# READ-ONLY by default. Posting a PR comment needs a write token, which is a
# security-posture decision, so it lives in the separate `comment` job below and
# runs only when the repository variable QPACK_REVIEW_COMMENT is "true".
permissions:
  contents: read

concurrency:
  group: pendant-review-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  review:
    name: pendant review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The PR HEAD, not the synthetic merge commit: the report compares
          # the merge-base version of each pack with the version under review.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      # `shacl` is required: without it the report says NOT CHECKED and the
      # gate refuses rather than passing.
      - name: Unavailable SHACL library control
        run: cargo test --locked --no-default-features --test share_review_no_shacl
      - name: Gate regression controls
        run: cargo test --locked --features shacl --test share_review
      - run: cargo build --locked --features shacl --bin quipu
      - name: Review changed packs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/pendant-review.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --binary target/debug/quipu \
            --summary "$GITHUB_STEP_SUMMARY" \
            --comment-body pendant-review.md
      - if: always() && vars.QPACK_REVIEW_COMMENT == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pendant-review
          path: pendant-review.md
          if-no-files-found: ignore

  # OFF unless the repository variable QPACK_REVIEW_COMMENT is "true". This is
  # the only job holding a write permission, it runs no repository code, and it
  # never runs for a fork (whose token cannot write anyway).
  comment:
    name: pendant review comment
    needs: review
    if: >-
      always() && vars.QPACK_REVIEW_COMMENT == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pendant-review
      - name: Create or update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -s pendant-review.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- quipu-qpack-review -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@pendant-review.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@pendant-review.md >/dev/null
          fi
