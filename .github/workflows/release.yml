name: Release

on:
  push:
    branches: [main]
  # Manual re-run of the artifact build for an existing tag, e.g. when a
  # release job failed after the tag was already pushed. Skips release-plz.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to (e.g. quipu-ai-v0.3.28)"
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

# Only the newest main commit can produce a release. The CI waiter otherwise
# occupies one runner for up to 50 minutes per superseded push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-correctness:
    name: Wait for CI correctness
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the cross-workflow gate
        run: |
          python3 scripts/test_wait_release_correctness.py
          python3 scripts/test_release_ci_gate.py
      - name: Require CI correctness for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/wait_release_correctness.py "$GITHUB_SHA"

  release-plz:
    name: Release-plz
    needs: ci-correctness
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # release-plz refuses a repository where a tracked path is also ignored,
      # even when checkout itself is clean. Catch the repository invariant at
      # the boundary instead of waiting through release-plz setup to discover it.
      - name: Reject tracked files matched by .gitignore
        run: |
          set -euo pipefail
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            echo "Tracked files are also ignored:" >&2
            printf '%s\n' "$tracked_ignored" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      # DO NOT split this into ordered `command: release` / `command: release-pr`
      # steps to fix the full-history changelog dump. That was tried on 2026-08-02
      # and MEASURED NOT TO WORK — recorded here so the next person does not spend
      # the afternoon rediscovering it.
      #
      # The plausible story was: the action (given no `command`) runs `release-pr`
      # before `release`, so on a release-merge push the just-bumped version has no
      # tag yet and `release-pr` has no baseline. Splitting so the tag lands first
      # should fix it. It did not. With the split live, v0.3.17 was tagged at
      # 15:07:28Z and the next release PR (#61) was opened at 15:10:00Z — two and a
      # half minutes AFTER the tag existed — and it was still a 259-line dump of the
      # entire project history. Tag presence is not the variable.
      #
      # What the run log actually shows is `downloading packages from cargo registry
      # crates.io` followed by `determining next version for quipu 0.3.17`:
      # release-plz takes its baseline from the PUBLISHED CRATE, not from git. The
      # `quipu` name on crates.io belongs to an unrelated post-quantum crypto library
      # (11 versions, max 0.10.0, different author), so nothing it downloads matches
      # this source and it walks back to the root commit. `publish = false` in
      # release-plz.toml stops us publishing; it does not stop that lookup.
      #
      # So the real fix is to stop release-plz resolving its baseline against a
      # stranger's crate. Until then the `verify-changelog` job below is what keeps a
      # bad section from being merged, and it is the part that is proven to work.
      #
      # ⚠ EXPECT `Verify changelog` TO BE RED, AND DO NOT "FIX" IT BY LOOSENING IT.
      # EVERY release PR release-plz generates here is defective — measured on four in
      # a row (#59 full-history dump, #60 missing 1 commit, #61 dump then missing 1,
      # #62 missing 2). The red is that known defect, not a new regression, and it
      # clears only when the section is corrected by hand or the cause above is fixed.
      # `Release-plz` and `Verify changelog` are deliberately separate jobs so this
      # failure cannot be misread as the release itself having failed.
      - uses: MarcoIeni/release-plz-action@v0.5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # Correct the section release-plz just wrote, in the same run that wrote it.
      #
      # This step exists because the two obvious alternatives do not work here:
      #
      #   Correcting by hand does not survive. release-plz ABANDONS a branch it did
      #   not write — measured on #61, where a hand-correction was discarded three
      #   seconds after the next push to main and a fresh PR opened carrying the
      #   defect again (see the note at the top of changelog-check.yml).
      #
      #   A separate workflow triggered on `push` to `release-plz-**` would never
      #   fire. release-plz pushes with GITHUB_TOKEN, and GitHub deliberately does
      #   not re-trigger workflows from token-authored pushes — the same reason the
      #   `artifacts` job below is a job here rather than a `release: published`
      #   trigger.
      #
      # So it runs inline, right after the PR is (re)generated. fix-changelog.sh is
      # idempotent and drops release-mechanics commits from the body, so its own
      # correction commit does not become a new entry needing another correction.
      - name: Correct the release PR's changelog section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="$(gh pr list --state open --json headRefName \
                  --jq '[.[] | select(.headRefName | startswith("release-plz"))][0].headRefName // ""')"
          if [ -z "$BR" ]; then
            echo "No open release PR — nothing to correct."
            exit 0
          fi
          echo "Correcting release PR branch: ${BR}"
          git fetch --quiet origin "$BR"
          git checkout --quiet -B "$BR" "origin/$BR"

          ./scripts/fix-changelog.sh

          if git diff --quiet -- CHANGELOG.md; then
            echo "Section was already correct; nothing pushed."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore: regenerate the release changelog section with git-cliff"
            git push origin "$BR"
            echo "Pushed a corrected section to ${BR}."
          fi

          # Fail loudly if the correction did not actually satisfy the verifier —
          # a corrector that silently produces a still-wrong section is worse than
          # no corrector, because the red check that used to catch it is gone.
          ./scripts/verify-changelog.sh

  # The changelog guard, on a trigger that actually fires.
  #
  # `changelog-check.yml` runs this same script on `pull_request`, and it has NEVER
  # EXECUTED: all 33 of its runs, every one on a `release-plz-*` branch, are
  # `action_required` with 0s duration. Release PRs are authored by
  # `app/github-actions`, and workflow runs on bot-authored PRs sit unapproved until
  # a human clicks. So the guard reported nothing, was never green or red, and the
  # bug it was written for shipped three times underneath it.
  #
  # `push` to main is not gated that way, so this copy runs. Keep the pull_request
  # one — it covers human PRs that touch CHANGELOG.md — but this is the one that
  # actually protects releases.
  verify-changelog:
    name: Verify changelog
    needs: release-plz
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: the verifier ranges over v<prev>..HEAD

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # The guard shipped able to fail in only one direction. Prove it can still
      # fail in both BEFORE trusting either verdict below — a check that cannot
      # fail reads exactly like a check that passed.
      - name: Self-test the guard (both directions)
        run: ./scripts/test-verify-changelog.sh

      - name: Verify the newest section on main
        run: ./scripts/verify-changelog.sh

      # The pending release PR is the artifact that actually gets merged, and it is
      # regenerated on every push — so it is worth re-checking every push, not just
      # at creation.
      - name: Verify the pending release PR, if there is one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="$(gh pr list --state open --json headRefName \
                  --jq '[.[] | select(.headRefName | startswith("release-plz"))][0].headRefName // ""')"
          if [ -z "$BR" ]; then
            echo "No open release PR — nothing to verify."
            exit 0
          fi
          echo "Verifying pending release PR branch: ${BR}"
          git fetch --quiet origin "${BR}:refs/remotes/origin/${BR}" || {
            echo "::warning::could not fetch ${BR}"; exit 0; }
          ./scripts/verify-changelog.sh --at "refs/remotes/origin/${BR}"

  # The browser bundle the book's "Explore this repository's graph" page runs
  # (aegis-tpqccc). A release asset rather than a committed artifact for the same
  # reason the linux binaries are: the repo stays source-only, and the Pages build
  # needs no Rust — the docs workflow just downloads this.
  #
  # A SEPARATE job from `artifacts` on purpose. They share nothing but the tag,
  # and coupling them would mean a wasm toolchain problem holds up the binary
  # release, which is the artifact people actually install.
  wasm:
    name: Wasm (release asset)
    needs: release-plz
    # `always()` so the manual path (which skips release-plz entirely) still
    # runs; the rest of the condition is the real gate.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-plz.outputs.releases_created == 'true')
    permissions:
      contents: write
      # `gh workflow run` needs actions:write. Without it the final restage step
      # dies with HTTP 403 "Resource not accessible by integration" — AFTER the
      # asset has already uploaded, so the release is fine and the job is red,
      # which is the confusing shape. Measured on the v0.3.33 artifact re-run.
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ONE definition, shared with ci.yml's `Wasm (browser bundle)`. Until
      # aegis-dsbt2g these were two hand-maintained job lists running the same
      # acceptance, and they diverged the moment they were written: this copy was
      # missing `cargo build --bin quipu`, the smoke mints a share with the native
      # binary, and this job died at `spawnSync .../quipu ENOENT` AFTER v0.3.33 was
      # tagged — while the PR job was green on the same commit. Change the steps in
      # the action, not here.
      - uses: ./.github/actions/wasm-explorer-build

      - name: Resolve package-qualified tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "quipu-ai") | .version')"
            TAG="quipu-ai-v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      # Refuse to write assets onto a tag that is not the commit we built.
      # The dispatch path checks out the dispatch BRANCH and uses the tag only
      # to name the artifact and pick the upload target, and every upload below
      # passes --clobber — so without this, dispatching on an older tag replaces
      # that release's assets with main builds AND regenerates their checksums to
      # match, which a downloader's verification then passes. See aegis-dsbt2g.
      #
      # DISPATCH ONLY, DELIBERATELY. The push path cannot exhibit this: release-plz
      # tags the very commit this run is building, so tag and HEAD agree by
      # construction. Asserting it there as well would be strictly stronger IF that
      # is exactly true — and I could not verify it without cutting a real release,
      # while getting it wrong would refuse EVERY release. A guard that might break
      # the lane it protects is not a safety improvement. The hazard lives entirely
      # in the manual path; that is where the guard goes.
      - uses: ./.github/actions/assert-tag-is-head
        if: github.event_name == 'workflow_dispatch'
        with:
          tag: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          NAME="quipu-${TAG}-wasm"
          mkdir -p "dist/${NAME}"
          cp wasm/explorer/pkg/quipu_wasm_explorer.js \
             wasm/explorer/pkg/quipu_wasm_explorer_bg.wasm \
             wasm/explorer/pkg/quipu_wasm_explorer.d.ts \
             wasm/explorer/pkg/quipu_wasm_explorer_bg.wasm.d.ts \
             "dist/${NAME}/"
          cp LICENSE "dist/${NAME}/"
          cat > "dist/${NAME}/README.txt" <<'EOF'
          quipu, compiled to wasm32-unknown-unknown for the browser.

          This is the bundle behind "Explore this repository's graph" in the book
          (https://scbrown.github.io/quipu/explore/). It opens an in-memory quipu
          store in a tab, imports a .qpack share through the same
          share_transport -> share_import -> promote path the `quipu import` CLI
          takes, and answers SPARQL through the same `tool_query` entry point the
          REST API and the MCP server use.

          Load it as an ES module from a Web Worker (the import of a large pack is
          seconds of solid CPU and will freeze a main thread):

            import init, { Explorer, explorerVersion }
              from "./quipu_wasm_explorer.js";
            await init();
            const ex = Explorer.loadQpack(bytes, "source-label", timestampIso);
            JSON.parse(ex.loadReport());   // manifest + import + promotion
            JSON.parse(ex.query(sparql));  // SELECT/ASK/CONSTRUCT/DESCRIBE

          Built WITHOUT the `shacl` feature. `import.validation.conforms` is
          therefore a default and not a validation result -- the off-vocabulary
          check does run, since it does not need the SHACL engine. Use the native
          `quipu import` for full validation.

          Reference page source: docs/book/src/explore/ in the quipu repository.
          EOF
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist "dist/${NAME}"

      # Same acceptance as ci.yml, from the SAME definition — but pointed at the
      # PACKAGED layout rather than wasm-bindgen's output directory. That is the
      # one deliberate difference between the two callers, and it is the stronger
      # check: a file missed by the `cp` list above produces a tarball that cannot
      # instantiate, and only smoking what actually ships can see it.
      - uses: ./.github/actions/wasm-explorer-smoke
        with:
          bundle-dir: dist/${{ steps.package.outputs.name }}

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::no GitHub release found for tag ${TAG}"
            exit 1
          fi
          gh release upload "$TAG" \
            "dist/${NAME}.tar.gz" \
            "dist/${NAME}.tar.gz.sha256" \
            --clobber

      # The book page serves the bundle and the pack from THIS site, because
      # GitHub sends no CORS header on release-asset downloads and a browser
      # therefore cannot fetch them cross-origin (measured 2026-09-05). So the
      # page only picks up a new release when the docs workflow next runs, and
      # nothing else would trigger it: a release-merge push touches CHANGELOG.md
      # and Cargo.toml, neither of which is in docs.yml's path filter.
      - name: Restage the book so it serves this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main

  # Attach release binaries built with the `full` feature bundle (Cargo.toml):
  # every feature the shipped binaries can actually use. NOT `--all-features` —
  # that would pull in lancedb, a backend the binaries cannot select.
  #
  # This runs as a job in the same workflow rather than on `release: published`
  # or a `v*` tag push, because release-plz creates both using GITHUB_TOKEN, and
  # GitHub deliberately does not re-trigger workflows from token-authored
  # releases or tag pushes — those triggers would simply never fire.
  artifacts:
    name: Binaries (${{ matrix.target }})
    needs: release-plz
    # `always()` so the manual path (which skips release-plz entirely) still
    # runs; the rest of the condition is the real gate.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-plz.outputs.releases_created == 'true')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # NOT ubuntu-latest on purpose: the newest image links against a
            # glibc most deployment hosts do not have yet, and the binary then
            # fails at exec with a GLIBC_2.xx error. Build against the oldest
            # image still supported so the artifact runs in more places.
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-

      # --locked so the artifact is built from the committed lockfile, not
      # whatever resolves that morning. seed-fixtures is a dev tool and is
      # deliberately not shipped.
      - name: Build (full feature bundle)
        run: |
          cargo build --release --locked --features full \
            --target ${{ matrix.target }} \
            --bin quipu --bin quipu-server

      - name: Resolve package-qualified tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            # release-plz has already bumped and committed Cargo.toml in the
            # commit this run is building, and tags it as quipu-ai-v<version>. Deriving
            # the tag from the manifest avoids depending on the shape of the
            # action's `releases` JSON output, which is undocumented.
            VERSION="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "quipu-ai") | .version')"
            TAG="quipu-ai-v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      # Refuse to write assets onto a tag that is not the commit we built.
      # The dispatch path checks out the dispatch BRANCH and uses the tag only
      # to name the artifact and pick the upload target, and every upload below
      # passes --clobber — so without this, dispatching on an older tag replaces
      # that release's assets with main builds AND regenerates their checksums to
      # match, which a downloader's verification then passes. See aegis-dsbt2g.
      #
      # DISPATCH ONLY, DELIBERATELY. The push path cannot exhibit this: release-plz
      # tags the very commit this run is building, so tag and HEAD agree by
      # construction. Asserting it there as well would be strictly stronger IF that
      # is exactly true — and I could not verify it without cutting a real release,
      # while getting it wrong would refuse EVERY release. A guard that might break
      # the lane it protects is not a safety improvement. The hazard lives entirely
      # in the manual path; that is where the guard goes.
      - uses: ./.github/actions/assert-tag-is-head
        if: github.event_name == 'workflow_dispatch'
        with:
          tag: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          NAME="quipu-${TAG}-${TARGET}"
          mkdir -p "dist/${NAME}"
          cp "target/${TARGET}/release/quipu" "dist/${NAME}/"
          cp "target/${TARGET}/release/quipu-server" "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/"

          # The binaries carry every feature, and two of them have runtime
          # requirements the archive itself cannot satisfy. Saying so here is
          # the difference between "semantic search is off" and a silent empty
          # result (cf. quipu #53).
          cat > "dist/${NAME}/FEATURES.txt" <<'EOF'
          Built with the `full` feature bundle:
            shacl, owl, onnx, reactive-reasoner

          NOT included: lancedb. That backend is reachable only by an embedder
          via Store::set_local_vector_backend -- the CLI and server cannot select
          it from config -- so shipping it would add a large build dependency for
          a capability these binaries do not expose.

          One feature needs something at RUNTIME that this archive cannot ship:

            onnx - links the ONNX Runtime dynamically (ort "load-dynamic"), so
                   libonnxruntime.so must be on the loader path before any
                   embedding or semantic search works. Without it everything else
                   runs normally and embeddings report that no provider is
                   configured. You also need model files plus a
                   [quipu.embedding] block in .bobbin/config.toml -- see
                   docs/book/src/concepts/embeddings.md.

          Everything else -- SPARQL, SHACL, the reasoner, the REST API and the
          web UI -- works from these binaries with no extra runtime deps.
          EOF

          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Smoke-test the built binaries
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release"
          # --version must not touch disk (aegis-j0nq), so this is safe and it
          # proves the artifact actually executes on a clean runner.
          "${BIN}/quipu" --version
          "${BIN}/quipu-server" --version
          # A real round trip: ingest a triple and read it back.
          TMP="$(mktemp -d)"
          printf '@prefix ex: <http://example.org/> .\nex:a a ex:T ; ex:rel ex:b .\n' > "${TMP}/t.ttl"
          "${BIN}/quipu" knot "${TMP}/t.ttl" --db "${TMP}/smoke.db"
          "${BIN}/quipu" stats --db "${TMP}/smoke.db"

      - name: Build the repository share artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/quipu"
          TMP="$(mktemp -d)"
          SHARE="${TMP}/repository-share"
          PACK="dist/quipu-${TAG}-repository.qpack.tar.gz"
          BOBBIN_TAG="v0.13.0"
          BOBBIN_ARCHIVE="bobbin-${BOBBIN_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "${BOBBIN_TAG}" --repo scbrown/bobbin \
            --pattern "${BOBBIN_ARCHIVE}" --dir "${TMP}"
          tar -C "${TMP}" -xzf "${TMP}/${BOBBIN_ARCHIVE}"
          BOBBIN_DIR="${TMP}/bobbin-${BOBBIN_TAG}-x86_64-unknown-linux-gnu"
          export LD_LIBRARY_PATH="${BOBBIN_DIR}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          scripts/build-repository-share.sh \
            "${BIN}" "${BOBBIN_DIR}/bobbin" "$GITHUB_WORKSPACE" \
            "${SHARE}" "$GITHUB_SHA"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -C "${SHARE}" -czf "${PACK}" .
          "${BIN}" import "${PACK}"
          ( cd dist && sha256sum "$(basename "${PACK}")" > "$(basename "${PACK}").sha256" )

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          # Fail loudly rather than silently producing an artifact nobody can
          # find: if the tag has no release, something upstream went wrong.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::no GitHub release found for tag ${TAG}"
            exit 1
          fi
          gh release upload "$TAG" \
            "dist/${NAME}.tar.gz" \
            "dist/${NAME}.tar.gz.sha256" \
            "dist/quipu-${TAG}-repository.qpack.tar.gz" \
            "dist/quipu-${TAG}-repository.qpack.tar.gz.sha256" \
            --clobber

  # THE REAL CRATES LANE (aegis-pb4rzi). It lives HERE, not in crates.yml.
  #
  # crates.yml triggers on `release: [published]`. release-plz creates the
  # release with GITHUB_TOKEN, and GitHub deliberately does not trigger
  # workflows from events raised by GITHUB_TOKEN — the same mechanism that stops
  # its tag pushes from firing anything, and the reason the `artifacts` job
  # above already lives in this workflow rather than on a tag trigger.
  #
  # So on a real release the crates publish never ran at all. crates.io sat at
  # 0.3.27 from 2026-08-27 while the repo shipped through 0.3.33: six versions
  # that never reached the registry, with `cargo add quipu-ai` quietly installing
  # nine-day-old code. A missing crate fails loudly; a STALE one succeeds
  # silently, which is why this was invisible.
  #
  # Running it as a job in this run removes the cross-workflow event entirely —
  # there is nothing left to be swallowed.
  crates:
    name: Publish to crates.io
    # AFTER the assets. A release whose binaries failed to build should not be
    # announced to the registry, and crates.io publication is the one step here
    # that cannot be undone: a version, once published, is permanent.
    needs: [release-plz, wasm, artifacts]
    # `always()` so a skipped/failed sibling does not silently swallow this job
    # the way the missing event did — but the explicit success checks below mean
    # it still refuses to publish on top of a broken release.
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.release-plz.outputs.releases_created == 'true' &&
      needs.wasm.result == 'success' &&
      needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TAG, NOT Cargo.toml. The action refuses to publish when the crate is
      # not at the version the caller intended, and that check is only worth
      # anything if the two numbers come from different places. Reading git refs
      # is independent of the manifest; deriving it with `cargo metadata` would
      # compare a number to itself.
      #
      # On this path release-plz tags the very commit being built, so the two
      # agree by construction and this reads as a consistency assertion rather
      # than an independent one. It costs nothing, and it is the check that
      # catches the case where they DON'T.
      - name: Resolve the released version from the tag
        id: want
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          TAG="$(git tag --points-at HEAD | grep '^quipu-ai-v' | head -1 || true)"
          if [ -z "$TAG" ]; then
            echo "::error::release-plz reported a release but no quipu-ai-v* tag" \
                 "points at HEAD. Refusing to publish a version this run cannot name."
            exit 1
          fi
          echo "want=${TAG##*-v}" >> "$GITHUB_OUTPUT"
          echo "tag ${TAG} -> version ${TAG##*-v}"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      # ONE definition, shared with crates.yml's manual lane. Change the steps
      # in the action, not here — two hand-maintained copies of the same publish
      # is the aegis-dsbt2g shape, and this lane already has a history of a green
      # run that moved nothing.
      - uses: ./.github/actions/crates-publish
        with:
          expected-version: ${{ steps.want.outputs.want }}
          dry-run: 'false'
