name: Release

on:
  push:
    branches: [main]
  # Manual re-run of the artifact build for an existing tag, e.g. when a
  # release job failed after the tag was already pushed. Skips release-plz.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to (e.g. v0.3.15)"
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # release-plz refuses a repository where a tracked path is also ignored,
      # even when checkout itself is clean. Catch the repository invariant at
      # the boundary instead of waiting through release-plz setup to discover it.
      - name: Reject tracked files matched by .gitignore
        run: |
          set -euo pipefail
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            echo "Tracked files are also ignored:" >&2
            printf '%s\n' "$tracked_ignored" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      # DO NOT split this into ordered `command: release` / `command: release-pr`
      # steps to fix the full-history changelog dump. That was tried on 2026-08-02
      # and MEASURED NOT TO WORK — recorded here so the next person does not spend
      # the afternoon rediscovering it.
      #
      # The plausible story was: the action (given no `command`) runs `release-pr`
      # before `release`, so on a release-merge push the just-bumped version has no
      # tag yet and `release-pr` has no baseline. Splitting so the tag lands first
      # should fix it. It did not. With the split live, v0.3.17 was tagged at
      # 15:07:28Z and the next release PR (#61) was opened at 15:10:00Z — two and a
      # half minutes AFTER the tag existed — and it was still a 259-line dump of the
      # entire project history. Tag presence is not the variable.
      #
      # What the run log actually shows is `downloading packages from cargo registry
      # crates.io` followed by `determining next version for quipu 0.3.17`:
      # release-plz takes its baseline from the PUBLISHED CRATE, not from git. The
      # `quipu` name on crates.io belongs to an unrelated post-quantum crypto library
      # (11 versions, max 0.10.0, different author), so nothing it downloads matches
      # this source and it walks back to the root commit. `publish = false` in
      # release-plz.toml stops us publishing; it does not stop that lookup.
      #
      # So the real fix is to stop release-plz resolving its baseline against a
      # stranger's crate. Until then the `verify-changelog` job below is what keeps a
      # bad section from being merged, and it is the part that is proven to work.
      #
      # ⚠ EXPECT `Verify changelog` TO BE RED, AND DO NOT "FIX" IT BY LOOSENING IT.
      # EVERY release PR release-plz generates here is defective — measured on four in
      # a row (#59 full-history dump, #60 missing 1 commit, #61 dump then missing 1,
      # #62 missing 2). The red is that known defect, not a new regression, and it
      # clears only when the section is corrected by hand or the cause above is fixed.
      # `Release-plz` and `Verify changelog` are deliberately separate jobs so this
      # failure cannot be misread as the release itself having failed.
      - uses: MarcoIeni/release-plz-action@v0.5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # Correct the section release-plz just wrote, in the same run that wrote it.
      #
      # This step exists because the two obvious alternatives do not work here:
      #
      #   Correcting by hand does not survive. release-plz ABANDONS a branch it did
      #   not write — measured on #61, where a hand-correction was discarded three
      #   seconds after the next push to main and a fresh PR opened carrying the
      #   defect again (see the note at the top of changelog-check.yml).
      #
      #   A separate workflow triggered on `push` to `release-plz-**` would never
      #   fire. release-plz pushes with GITHUB_TOKEN, and GitHub deliberately does
      #   not re-trigger workflows from token-authored pushes — the same reason the
      #   `artifacts` job below is a job here rather than a `release: published`
      #   trigger.
      #
      # So it runs inline, right after the PR is (re)generated. fix-changelog.sh is
      # idempotent and drops release-mechanics commits from the body, so its own
      # correction commit does not become a new entry needing another correction.
      - name: Correct the release PR's changelog section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="$(gh pr list --state open --json headRefName \
                  --jq '[.[] | select(.headRefName | startswith("release-plz"))][0].headRefName // ""')"
          if [ -z "$BR" ]; then
            echo "No open release PR — nothing to correct."
            exit 0
          fi
          echo "Correcting release PR branch: ${BR}"
          git fetch --quiet origin "$BR"
          git checkout --quiet -B "$BR" "origin/$BR"

          ./scripts/fix-changelog.sh

          if git diff --quiet -- CHANGELOG.md; then
            echo "Section was already correct; nothing pushed."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore: regenerate the release changelog section with git-cliff"
            git push origin "$BR"
            echo "Pushed a corrected section to ${BR}."
          fi

          # Fail loudly if the correction did not actually satisfy the verifier —
          # a corrector that silently produces a still-wrong section is worse than
          # no corrector, because the red check that used to catch it is gone.
          ./scripts/verify-changelog.sh

  # The changelog guard, on a trigger that actually fires.
  #
  # `changelog-check.yml` runs this same script on `pull_request`, and it has NEVER
  # EXECUTED: all 33 of its runs, every one on a `release-plz-*` branch, are
  # `action_required` with 0s duration. Release PRs are authored by
  # `app/github-actions`, and workflow runs on bot-authored PRs sit unapproved until
  # a human clicks. So the guard reported nothing, was never green or red, and the
  # bug it was written for shipped three times underneath it.
  #
  # `push` to main is not gated that way, so this copy runs. Keep the pull_request
  # one — it covers human PRs that touch CHANGELOG.md — but this is the one that
  # actually protects releases.
  verify-changelog:
    name: Verify changelog
    needs: release-plz
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: the verifier ranges over v<prev>..HEAD

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # The guard shipped able to fail in only one direction. Prove it can still
      # fail in both BEFORE trusting either verdict below — a check that cannot
      # fail reads exactly like a check that passed.
      - name: Self-test the guard (both directions)
        run: ./scripts/test-verify-changelog.sh

      - name: Verify the newest section on main
        run: ./scripts/verify-changelog.sh

      # The pending release PR is the artifact that actually gets merged, and it is
      # regenerated on every push — so it is worth re-checking every push, not just
      # at creation.
      - name: Verify the pending release PR, if there is one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="$(gh pr list --state open --json headRefName \
                  --jq '[.[] | select(.headRefName | startswith("release-plz"))][0].headRefName // ""')"
          if [ -z "$BR" ]; then
            echo "No open release PR — nothing to verify."
            exit 0
          fi
          echo "Verifying pending release PR branch: ${BR}"
          git fetch --quiet origin "${BR}:refs/remotes/origin/${BR}" || {
            echo "::warning::could not fetch ${BR}"; exit 0; }
          ./scripts/verify-changelog.sh --at "refs/remotes/origin/${BR}"

  # Attach release binaries built with the `full` feature bundle (Cargo.toml):
  # every feature the shipped binaries can actually use. NOT `--all-features` —
  # that would pull in lancedb, a backend the binaries cannot select.
  #
  # This runs as a job in the same workflow rather than on `release: published`
  # or a `v*` tag push, because release-plz creates both using GITHUB_TOKEN, and
  # GitHub deliberately does not re-trigger workflows from token-authored
  # releases or tag pushes — those triggers would simply never fire.
  artifacts:
    name: Binaries (${{ matrix.target }})
    needs: release-plz
    # `always()` so the manual path (which skips release-plz entirely) still
    # runs; the rest of the condition is the real gate.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-plz.outputs.releases_created == 'true')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # NOT ubuntu-latest on purpose: the newest image links against a
            # glibc most deployment hosts do not have yet, and the binary then
            # fails at exec with a GLIBC_2.xx error. Build against the oldest
            # image still supported so the artifact runs in more places.
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-

      # --locked so the artifact is built from the committed lockfile, not
      # whatever resolves that morning. seed-fixtures is a dev tool and is
      # deliberately not shipped.
      - name: Build (full feature bundle)
        run: |
          cargo build --release --locked --features full \
            --target ${{ matrix.target }} \
            --bin quipu --bin quipu-server

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            # release-plz has already bumped and committed Cargo.toml in the
            # commit this run is building, and tags it as v<version>. Deriving
            # the tag from the manifest avoids depending on the shape of the
            # action's `releases` JSON output, which is undocumented.
            VERSION="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "quipu") | .version')"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      - name: Package
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          NAME="quipu-${TAG}-${TARGET}"
          mkdir -p "dist/${NAME}"
          cp "target/${TARGET}/release/quipu" "dist/${NAME}/"
          cp "target/${TARGET}/release/quipu-server" "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/"

          # The binaries carry every feature, and two of them have runtime
          # requirements the archive itself cannot satisfy. Saying so here is
          # the difference between "semantic search is off" and a silent empty
          # result (cf. quipu #53).
          cat > "dist/${NAME}/FEATURES.txt" <<'EOF'
          Built with the `full` feature bundle:
            shacl, owl, onnx, reactive-reasoner

          NOT included: lancedb. That backend is reachable only by an embedder
          via Store::set_local_vector_backend -- the CLI and server cannot select
          it from config -- so shipping it would add a large build dependency for
          a capability these binaries do not expose.

          One feature needs something at RUNTIME that this archive cannot ship:

            onnx - links the ONNX Runtime dynamically (ort "load-dynamic"), so
                   libonnxruntime.so must be on the loader path before any
                   embedding or semantic search works. Without it everything else
                   runs normally and embeddings report that no provider is
                   configured. You also need model files plus a
                   [quipu.embedding] block in .bobbin/config.toml -- see
                   docs/book/src/concepts/embeddings.md.

          Everything else -- SPARQL, SHACL, the reasoner, the REST API and the
          web UI -- works from these binaries with no extra runtime deps.
          EOF

          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Smoke-test the built binaries
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release"
          # --version must not touch disk (aegis-j0nq), so this is safe and it
          # proves the artifact actually executes on a clean runner.
          "${BIN}/quipu" --version
          "${BIN}/quipu-server" --version
          # A real round trip: ingest a triple and read it back.
          TMP="$(mktemp -d)"
          printf '@prefix ex: <http://example.org/> .\nex:a a ex:T ; ex:rel ex:b .\n' > "${TMP}/t.ttl"
          "${BIN}/quipu" knot "${TMP}/t.ttl" --db "${TMP}/smoke.db"
          "${BIN}/quipu" stats --db "${TMP}/smoke.db"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          # Fail loudly rather than silently producing an artifact nobody can
          # find: if the tag has no release, something upstream went wrong.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::no GitHub release found for tag ${TAG}"
            exit 1
          fi
          gh release upload "$TAG" \
            "dist/${NAME}.tar.gz" \
            "dist/${NAME}.tar.gz.sha256" \
            --clobber
