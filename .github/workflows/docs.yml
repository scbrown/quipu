name: Docs

# The two path lists are duplicated on purpose: GitHub Actions does not
# support YAML anchors in workflow files, so an alias here would not expand.
# Keep them identical.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
      # The 3D Datalinks demo is published from ui/ sources, staged into the
      # book by `just docs-assets`. Without this the page silently goes stale
      # whenever the renderer changes.
      - 'ui/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
      - 'ui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid

      # Same copy `just docs-assets` does locally, inlined so the workflow does
      # not need `just`. Keep the two in step — the demo's graph.json IS
      # committed (the Pages build must not need Rust), but its runtime assets
      # are not, because ui/ owns them.
      - name: Stage Datalinks demo assets
        run: |
          mkdir -p docs/book/src/datalinks/vendor
          cp ui/datalinks.js ui/graph-canvas.js docs/book/src/datalinks/
          cp ui/vendor/three.module.min.js docs/book/src/datalinks/vendor/

      # The "Explore this repository's graph" page (aegis-tpqccc) runs quipu
      # compiled to wasm and imports the release's own knowledge pack. Both are
      # RELEASE ASSETS, downloaded here rather than committed — so the repo stays
      # source-only and this build still needs no Rust.
      #
      # They are staged INTO the site rather than fetched by the page at runtime
      # because a browser cannot fetch them: GitHub serves release-asset
      # downloads with no `Access-Control-Allow-Origin` header, so `fetch()` from
      # scbrown.github.io is refused before the response is readable. Measured in
      # a real browser from the real Pages origin, 2026-09-05 — via github.com,
      # via /releases/latest/download, and via the api.github.com asset endpoint,
      # which 302s to the same non-CORS host. Do not "simplify" this away by
      # pointing the page at a release URL; it will fail silently for readers and
      # work for whoever tests it with curl.
      #
      # Deliberately NON-FATAL. Until a release ships carrying the wasm asset
      # there is nothing to stage, and the docs must keep building; the page says
      # so itself and still accepts a pack from a file picker. `mdbook build`
      # copies whatever is in src/, so a missing bundle simply is not published.
      - name: Stage the explorer bundle and repository pack from the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          DEST=docs/book/src/explore
          TMP="$(mktemp -d)"
          TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "${TAG}" ]; then
            echo "::warning::no GitHub release found — the explorer page will ship unstaged"
            exit 0
          fi
          echo "Staging explorer assets from release ${TAG}"

          if gh release download "${TAG}" --pattern '*-wasm.tar.gz' --dir "${TMP}"; then
            mkdir -p "${DEST}/pkg"
            tar -C "${TMP}" -xzf "${TMP}"/*-wasm.tar.gz
            find "${TMP}" -name 'quipu_wasm_explorer*' -exec cp {} "${DEST}/pkg/" \;
          else
            echo "::warning::release ${TAG} has no wasm bundle yet (first one lands with the next release)"
          fi

          if gh release download "${TAG}" --pattern '*-repository.qpack.tar.gz' --dir "${TMP}"; then
            cp "${TMP}"/*-repository.qpack.tar.gz "${DEST}/repository.qpack.tar.gz"
          else
            echo "::warning::release ${TAG} has no repository qpack"
          fi
          ls -la "${DEST}" "${DEST}/pkg" 2>/dev/null || true

      - name: Build book
        run: mdbook build docs/book

      - name: Verify the demo was published
        run: |
          for f in index.html graph.json datalinks.js graph-canvas.js \
                   vendor/three.module.min.js; do
            test -s "docs/book/book/datalinks/$f" \
              || { echo "missing from book output: datalinks/$f"; exit 1; }
          done

      # The page's own sources are committed, so they must ALWAYS be published —
      # that half is a hard failure. The staged release artifacts are conditional
      # (see the staging step), so they are checked only when staging produced
      # them: a page published without its wasm is a real state, and it tells the
      # reader so rather than pretending.
      - name: Verify the explorer page was published
        run: |
          set -euo pipefail
          for f in index.html explorer.js worker.js; do
            test -s "docs/book/book/explore/$f" \
              || { echo "missing from book output: explore/$f"; exit 1; }
          done
          if [ -d docs/book/src/explore/pkg ]; then
            for f in pkg/quipu_wasm_explorer.js pkg/quipu_wasm_explorer_bg.wasm \
                     repository.qpack.tar.gz; do
              test -s "docs/book/book/explore/$f" \
                || { echo "staged but not published: explore/$f"; exit 1; }
            done
            echo "explorer published WITH its wasm bundle and repository pack"
          else
            echo "::warning::explorer published WITHOUT a wasm bundle (no release carries one yet)"
          fi

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          # `docs/book/book`, not `docs/book/book/html`: mdbook nests output
          # under a per-renderer directory only when SEVERAL renderers are
          # registered. book.toml used to register linkcheck as a second one,
          # which is why the old path had /html on it.
          path: docs/book/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
