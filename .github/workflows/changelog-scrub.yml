name: Changelog scrub

on:
  pull_request:
    paths:
      - cliff.toml
      - scripts/test_changelog_scrub.py
      - .github/workflows/changelog-scrub.yml
  push:
    branches: [main]
    paths:
      - cliff.toml
      - scripts/test_changelog_scrub.py
      - .github/workflows/changelog-scrub.yml

# Superseded PR runs share a group; every non-PR run keeps its own group.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - run: python3 scripts/test_changelog_scrub.py
