name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    # A PRERELEASE must never reach crates.io. `release: [published]` fires for
    # prereleases too, and `cargo publish` publishes the version in Cargo.toml
    # regardless of which tag the release carries -- so a throwaway prerelease
    # would attempt to publish whatever main is currently at, under a tag nobody
    # intends to ship.
    #
    # This is not hypothetical. docs/RELEASING.md tells you to rehearse the
    # release workflow by creating a throwaway tag and a PRERELEASE for it, and
    # doing exactly that on 2026-09-05 fired this workflow (run 33959092337,
    # ref rehearsal-wasm-20260905-0951). It failed only because crates.io
    # Trusted Publishing is unconfigured (aegis-spg3zw) -- once that is fixed,
    # the documented rehearsal would attempt a real publish.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Verify package
        run: cargo package --no-verify

      - name: Publish (dry run)
        if: ${{ inputs.dry_run == true }}
        run: cargo publish --dry-run

      - name: Authenticate with crates.io
        if: ${{ inputs.dry_run != true }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1

      - name: Publish to crates.io
        if: ${{ inputs.dry_run != true }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
