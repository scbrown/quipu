[book]
title = "Quipu — AI-Native Knowledge Graph"
authors = ["Steve Brown"]
description = "Structured knowledge encoded in knotted strings"
src = "src"
language = "en"

[build]
build-dir = "book"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/scbrown/quipu"
edit-url-template = "https://github.com/scbrown/quipu/edit/main/docs/book/{path}"
additional-css = ["custom/css/custom.css"]
additional-js = ["custom/js/mermaid-init.js"]
site-url = "/quipu/"

[output.html.search]
enable = true

# NO [output.linkcheck]. mdbook-linkcheck 0.7.7 cannot parse the RenderContext
# that mdbook 0.5.x emits ("missing field `sections`") and exits non-zero, and
# `optional = true` only forgives a MISSING binary — not a failing one. So the
# stanza was inert purely because CI never installed the tool, and would have
# hard-failed `mdbook build` for anyone who did. Re-add it only once
# mdbook-linkcheck supports the mdbook version pinned here.
