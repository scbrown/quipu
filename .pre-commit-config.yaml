repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Same vendored file as the large-files exclusion below, same reason, and
      # it needs excluding here TOO: these two hooks REWRITE what they inspect,
      # so on every run they "fixed" `mermaid.min.js` and exited 1 with "files
      # were modified by this hook". That is why CI went red — see below.
      - id: trailing-whitespace
        exclude: ^docs/book/mermaid\.min\.js$
      - id: end-of-file-fixer
        exclude: ^docs/book/mermaid\.min\.js$
      - id: check-yaml
      - id: check-json
        types: [json]
      - id: check-merge-conflict
      - id: check-added-large-files
        # mermaid.min.js is a ~2.6MB vendored library written by
        # `mdbook-mermaid install`; the book needs it committed to render
        # diagrams (and to work offline under `mdbook serve`). Excluded by exact
        # path so the 500KB guard stays tight for everything else.
        exclude: ^docs/book/mermaid\.min\.js$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: []

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy-no-default
        name: cargo clippy (no default features)
        entry: cargo clippy --no-default-features -- -D warnings -A missing-docs
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy-shacl
        name: cargo clippy (shacl)
        entry: cargo clippy --features shacl -- -D warnings -A missing-docs
        language: system
        types: [rust]
        pass_filenames: false

      - id: file-size-check
        name: file size check
        entry: scripts/check-file-size.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: mdbook-build
        name: mdbook build
        entry: scripts/precommit-mdbook.sh
        language: script
        files: ^docs/book/
        pass_filenames: false
