repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Same vendored file as the large-files exclusion below, same reason, and
      # it needs excluding here TOO: these two hooks REWRITE what they inspect,
      # so on every run they "fixed" `mermaid.min.js` and exited 1 with "files
      # were modified by this hook". That is why CI went red — see below.
      - id: trailing-whitespace
        exclude: ^docs/book/mermaid\.min\.js$
      - id: end-of-file-fixer
        exclude: ^docs/book/mermaid\.min\.js$
      - id: check-yaml
      - id: check-json
        types: [json]
      - id: check-merge-conflict
      - id: check-added-large-files
        # Two vendored libraries must be committed to work offline, and both are
        # excluded by EXACT path so the 500KB guard stays tight for everything
        # else. mermaid.min.js (~2.6MB) is written by `mdbook-mermaid install`;
        # the book needs it to render diagrams under `mdbook serve`.
        # three.module.min.js (~672KB) backs the 3D Datalinks view, which is
        # bound by the same no-CDN rule as the 2D graph — see
        # docs/design/datalinks-3d.md §Air-gap.
        exclude: ^(docs/book/mermaid\.min\.js|ui/vendor/three\.module\.min\.js)$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: []

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      # --all-targets and the `full` variant mirror .github/workflows/ci.yml's
      # clippy matrix. Both are load-bearing, and their ABSENCE cost 17h of red
      # main (aegis-zw37h): without --all-targets these lint only the lib, and
      # quipu-server has required-features shacl+onnx so nothing below `full`
      # builds it at all. The two lints that held main red sat in exactly those
      # blind spots — a bin and a test file. A local gate that is a strict subset
      # of CI's does not fail earlier, it fails LATER and somewhere nobody reads.
      - id: cargo-clippy-no-default
        name: cargo clippy (no default features)
        entry: cargo clippy --no-default-features --all-targets -- -D warnings -A missing-docs
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy-shacl
        name: cargo clippy (shacl)
        entry: cargo clippy --features shacl --all-targets -- -D warnings -A missing-docs
        language: system
        types: [rust]
        pass_filenames: false

      # The slowest hook here, and deliberately kept: it is the ONLY one that
      # lints quipu-server and the owl / reactive-reasoner code. Drop it and those
      # files go unlinted locally again — which is the state that produced this
      # hook's own reason for existing.
      - id: cargo-clippy-full
        name: cargo clippy (full bundle — the one that lints quipu-server)
        entry: cargo clippy --features full --all-targets -- -D warnings -A missing-docs
        language: system
        types: [rust]
        pass_filenames: false

      - id: file-size-check
        name: file size check
        entry: scripts/check-file-size.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: mdbook-build
        name: mdbook build
        entry: scripts/precommit-mdbook.sh
        language: script
        files: ^docs/book/
        pass_filenames: false
