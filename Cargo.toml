[package]
name = "quipu"
version = "0.3.16"
edition = "2024"
description = "AI-native knowledge graph with strict ontology enforcement — Bobbin's knowledge module"
authors = ["Steve Brown"]
license = "MIT"
repository = "https://github.com/scbrown/quipu"
keywords = ["knowledge-graph", "rdf", "sparql", "ontology", "ai"]
categories = ["database", "data-structures"]
# The published book. `repository` already carries the GitHub URL, so pointing
# homepage at it too wasted one of the two links crates.io shows.
homepage = "https://scbrown.github.io/quipu/"
documentation = "https://docs.rs/quipu"
exclude = [
    ".github/",
    ".githooks/",
    ".vale/",
    ".vale.ini",
    ".pre-commit-config.yaml",
    ".markdownlint-cli2.yaml",
    ".prettierrc.yaml",
    "docs/",
    "assets/",
    "cliff.toml",
    "justfile",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CHANGELOG.md",
    "release-plz.toml",
    "scripts/",
]

[[bin]]
name = "quipu"
path = "src/main.rs"
required-features = ["shacl"]

[[bin]]
name = "quipu-server"
path = "src/server.rs"
required-features = ["shacl", "onnx"]

[[bin]]
name = "seed-fixtures"
path = "src/bin/seed_fixtures.rs"
required-features = ["shacl"]

# The example calls `quipu::validate_shapes`, which is gated behind `shacl`.
# `cargo test` builds examples, so without this the `--no-default-features` CI
# job failed to compile an example that can never work in that configuration.
[[example]]
name = "shacl_cost"
path = "examples/shacl_cost.rs"
required-features = ["shacl"]

[dependencies]
# Fair (FIFO) store mutex for the server: with std's unfair Mutex a sustained
# writer stream can starve readers indefinitely (the mfg0 write-flood incident).
parking_lot = "0.12"
ureq = { version = "2", default-features = false }
rusqlite = { version = "0.33", features = ["bundled", "hooks"] }
thiserror = "2"
oxrdf = "0.3"
oxttl = "0.2"
oxrdfio = "0.2"
sparesults = "0.3"
ring = "0.17"
hex = "0.4"
spargebra = "0.4"
regex = "1"
rudof_lib = { version = "0.2.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
petgraph = "0.7"
datafrog = "2"
toml = "0.8"
strsim = "0.11"
lancedb = { version = "0.27", optional = true }
arrow-array = { version = "57", optional = true }
arrow-schema = { version = "57", optional = true }
futures = { version = "0.3", optional = true }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic"], optional = true }
tokenizers = { version = "0.21", optional = true }
ndarray = { version = "0.16", optional = true }

[features]
default = ["shacl"]
shacl = ["dep:rudof_lib"]
owl = []
lancedb = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures"]
onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
reactive-reasoner = []

# What the shipped release binaries are built with — every feature the binaries
# can actually USE. Named here rather than spelled out in the workflows so CI
# and the release build cannot drift apart.
#
# Deliberately EXCLUDES `lancedb`: the CLI and server cannot select that backend
# from config (it is reachable only by an embedder via
# `Store::set_local_vector_backend`), so shipping it would add a protoc build
# dependency and the whole datafusion tree for a capability the binaries do not
# expose. `--all-features` is therefore NOT what a release is built with.
full = ["shacl", "owl", "onnx", "reactive-reasoner"]

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
# Correctness & safety
cast_sign_loss = "warn"
checked_conversions = "warn"

# Code quality
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
needless_continue = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
string_add_assign = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"

[dev-dependencies]
tempfile = "3"
